; NOT CURRENTLY REQUIRED — every broadcast in this app (WalletBalanceUpdated,
; BetPoolUpdated) is sent inline (ShouldBroadcastNow), not queued, precisely
; so a payout/balance update reaches a player without waiting on a queue
; worker's poll cycle (the `database` driver's --sleep=1 below could add up
; to a full second of latency, which is unacceptable for that). Nothing in
; the app dispatches to a queue today. This config is kept around only for a
; future feature that's genuinely fine being delayed (non-latency-sensitive
; background work) — install it if/when that need actually exists, not by
; default.
;
; Install on the VPS:
;   sudo cp deploy/supervisor/laravel-worker.conf /etc/supervisor/conf.d/offline-bets-worker.conf
;   sudo nano /etc/supervisor/conf.d/offline-bets-worker.conf   # fix the two paths below for this box
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start offline-bets-worker:*
;
; Check it's actually running:
;   sudo supervisorctl status offline-bets-worker:*
;
; Watch for jobs that keep failing (shows up here, not in the app's own logs):
;   php artisan queue:failed

[program:offline-bets-worker]
; Adjust both paths to match this deployment.
command=php /var/www/offline-bets/artisan queue:work database --queue=default --sleep=1 --tries=3 --backoff=3 --max-time=3600 --timeout=60
directory=/var/www/offline-bets

; Two workers is deliberate, not a placeholder to raise — WalletBalanceUpdated
; is the only thing on this queue, it's a private per-user channel, and each
; job re-fetches the wallet fresh from the DB when it runs (see the class's
; own docblock), so out-of-order delivery across workers is harmless. Going
; much higher buys little (this job is cheap and fast) while eating into the
; same RAM budget PHP-FPM needs — see the PHP-FPM/MySQL sizing notes for this
; VPS's specs before changing this.
numprocs=2
process_name=%(program_name)s_%(process_num)02d

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; --max-time=3600 above restarts each worker hourly on its own (guards
; against slow memory growth over a long-running PHP process); this gives
; supervisor enough time to let that happen gracefully instead of killing a
; worker mid-job.
stopwaitsecs=3600

user=www-data
redirect_stderr=true
stdout_logfile=/var/www/offline-bets/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
