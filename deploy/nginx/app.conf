# Laravel vhost for the app tier (behind the ALB, which terminates TLS —
# this only ever speaks plain HTTP on the instance itself). Installed by
# infra/terraform/user_data/app.sh.tpl at /etc/nginx/sites-available/app.conf.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/offline-bets/public;
    index index.php;

    # ALB health check — kept lightweight and outside the Laravel bootstrap
    # (matches the app's own /up route, but this avoids a DB round-trip for
    # a check that fires every few seconds from every target).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm-app.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # ALB already sets these from the real client — trust them instead
        # of whatever a direct connection would otherwise show.
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 10m;
}
